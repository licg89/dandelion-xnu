#
# UEFI FD Configs (dandelion = Redmi 9A, MT6762G)
#
[uefi_fd]
# [MEASURED 2026-10-28] LK 只会把 kernel 段放到 0x40080000 并跳过去。
# 这条是刷机测出来的，不是读代码推出来的：
#   - 同一个位置无关的 bootshim，kernel_addr=0x40080000 -> 正常运行
#   - 同一个 bootshim，kernel_addr=0x48880000 -> 10 s 看门狗复位，代码没跑
# 所以 FD 必须按 0x40080000 链接。曾经改成 0x48880000（理由是
# PcdSystemMemoryBase=0x48000000），结果 FD 的入口 stub 从错误的地址解压，
# 表现就是和「没执行」一模一样的 10 s 复位，很容易误判。
# 这个值同时必须等于：
#   - Platforms/Xiaomi/dandelionPkg/Library/MemoryMapLib/MemoryMapLib.c
#     里的 "UEFI FD" 条目（0x40080000，0x200000）
#   - [boot_image].base + [boot_image].kernel_offset（见下）
# 三者任一不一致，固件就会被链接到错误的地址上跑。
base = 0x40080000
size = 0x200000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = false

[boot_image]
# base + kernel_offset 必须等于 [uefi_fd].base = 0x40080000。
# LK 把 kernel 段解压到 header 里的 kernel_addr，而这个 FD 的前 4 个字节
# 就是一条 AArch64 分支指令（0x140023EA = b +0x8FA8），跳到一个小的
# 解压/入口 stub。所以只要 kernel_addr == FD 基址，LK 直接把 FD 放对位置
# 再跳过去就行，**不需要 BootShim**（这也是这里没有 [boot_shim] 段的原因）。
# 0x40000000 + 0x00008000 = 0x40080000。
# ramdisk/tags/dtb 的地址跟着 base 平移（ramdisk 是个 5 字节占位文件，
# 实际不加载内容）。真机打包走 bootshim/patch_boot.py，那里用的是原厂
# boot 镜像里的 ramdisk/tags 地址，不受这几行影响。
base           = 0x40000000
cmdline        = "bootopt=64S3,32N2,64N2"
dtb            = "Resources/DTBs/dandelion.dtb"
dtb_offset     = 0x0BC08000
header_version = 2
kernel_offset  = 0x00008000
ramdisk_offset = 0x07C08000
second_offset  = 0xBFF88000
tags_offset    = 0x0BC08000
