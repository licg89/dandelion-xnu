# Runtime configuration for UniXNU, placed at \EFI\UniXNU\UniXNU.toml on the FAT
# volume the firmware puts at the start of the 'flashinfo' partition.
#
# Schema read from package/UniXNUPkg/Library/UniXNULib/Config.c: the file is
# looked for in \EFI\UniXNU on a volume; [[entry]] takes id / title / type /
# action / path / args / confirm / initrd / dtb with `path` relative to
# \EFI\UniXNU and `type` defaulting to "efi"; [[driver]] takes path / args /
# connect / enabled (AddDriver, Config.c ~560).
#
# Entry order is deliberate.  UniXNU's UI does not go through our ConOut -- it
# has its own font and draws GOP directly -- but everything it says through
# UniXNULog does.  PayloadBootDxe flushes the log again after StartImage
# returns, so if UniXNU parks at a menu waiting for a key, its messages never
# reach the medium and the only way to read them is a photograph.
#
# Entry 1 is therefore "exit": after the timeout UniXNU returns to the firmware,
# StartImage returns, and the second flush writes UniXNU's own log into flash.
# DarwinBoot moves to entry 2 -- it has already been proven to load and return
# Success (docs/M6-UNIXNU.md section 6), and proving it again is not worth losing
# the log channel for.

version = 1

[boot]
timeout = 3
rotate = 0

[ui]
title = "UniXNU dandelion"

# UniXNUDxe finds UniXNU.efi in a firmware volume by its FILE_GUID
# (PcdUniXNUApplicationFile) and starts it.
[[driver]]
path = "UniXNUDxe.efi"

# DarwinBoot must be started BEFORE any type = "xnu" entry is booted, because it
# is what installs gUniXNULoaderProtocolGuid (DarwinBoot.c: mLoader =
# { UNIXNU_LOADER_REVISION, Boot }, installed in its entry point).  Without it
# Boot.c takes the "xnu: no loader protocol installed" path and returns
# EFI_UNSUPPORTED -- which is exactly what the panel said:
#
#     "XNU (dandelion)" returned: Unsupported
#
[[driver]]
path = "DarwinBoot.efi"

[[entry]]
id = "xnu"
title = "XNU (dandelion)"
type = "xnu"
path = "kernel.macho"
args = "-v keepsyms=1 debug=0x144"

[[entry]]
id = "exit"
title = "Return to firmware"
type = "action"
action = "exit"

# The real thing eventually: DarwinBoot takes these arguments, builds XNU's
# command line, paints a green bar at the top of the screen and branches to the
# kernel.  Even with no kernel behind it, reaching the green bar proves the
# chain UniXNU -> DarwinBoot -> branch works.
[[entry]]
id = "darwinboot"
title = "DarwinBoot (dandelion)"
type = "efi"
path = "DarwinBoot.efi"
args = "-v keepsyms=1 debug=0x144"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"
