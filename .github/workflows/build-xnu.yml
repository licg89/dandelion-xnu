name: build-xnu

# XNU only builds on macOS, so the kernel is cross-compiled here and the
# resulting mach_kernel is downloaded, packaged with bootshim/patch_boot.py and
# flashed from a Windows/Linux workstation.

on:
  workflow_dispatch:
    inputs:
      machine:
        description: "XNU machine configuration"
        type: choice
        options: [bcm2837, dandelion]
        default: bcm2837
      kernel:
        description: "Kernel configuration"
        type: choice
        options: [DEVELOPMENT, RELEASE]
        default: DEVELOPMENT
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-xnu.yml"
      - "tools/ci/**"
      - "config/**"
      - "pexpert/**"
      - "iokit/**"
      - "patches/**"

concurrency:
  group: build-xnu-${{ github.ref }}-${{ inputs.machine || 'dandelion' }}-${{ inputs.kernel || 'DEVELOPMENT' }}
  cancel-in-progress: true

env:
  XNU_TAG: xnu-8796.141.3

jobs:
  build:
    # macos-14 is being retired (brownouts from 2026-10, removed 2026-11-02), and a
    # brownout cancels jobs while they sit in the queue:
    #   "This job failed because of a scheduled macOS 14 runner image brownout."
    # macos-15 is the current arm64 image and carries the same Xcode toolchain for
    # this build; see https://github.com/actions/runner-images/issues/13518.
    runs-on: macos-15
    timeout-minutes: 240

    env:
      MACHINE: ${{ inputs.machine || 'dandelion' }}
      KERNEL_CONFIG: ${{ inputs.kernel || 'DEVELOPMENT' }}
      XNU_SRC: ${{ github.workspace }}/.xnu-src
      BUILD_ROOT: ${{ github.workspace }}/build

    steps:
      - uses: actions/checkout@v4

      # xnu-8796 is from 2023 and expects clang 15.  The macos-15 image's default
      # Xcode ships a much newer clang, which rejects code this tree still has
      # (first: the -enable-trivial-auto-var-init-zero-... flag, then the
      # uio_stackbuf_t arrays in bsd/vfs/vfs_attrlist.c and security/mac_vfs_subr.c:
      # "size of array element ... isn't a multiple of its alignment").  Pinning an
      # older Xcode is the fix that does not require touching the tree; the list of
      # installed Xcodes is printed so a future image change is diagnosable from the
      # log instead of by guesswork.
      - name: Select an Xcode whose clang can build this tree
        run: |
          ls -d /Applications/Xcode*.app || true
          for candidate in Xcode_15.4 Xcode_15.3 Xcode_15.2 Xcode_15.1 Xcode_15.0; do
            if [ -d "/Applications/$candidate.app" ]; then
              echo "selecting $candidate"
              sudo xcode-select -s "/Applications/$candidate.app"
              break
            fi
          done
          xcode-select -p
          clang --version

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          clang --version
          echo "machine=$MACHINE kernel=$KERNEL_CONFIG"

      # A shallow clone of the release tag is ~200 MB and never changes, so it
      # is worth keeping between runs.
      - name: Cache XNU source
        uses: actions/cache@v4
        with:
          path: .xnu-src
          key: xnu-src-${{ env.XNU_TAG }}-v1

      - name: Fetch XNU ${{ env.XNU_TAG }}
        run: |
          if [ ! -f .xnu-src/Makefile ]; then
            rm -rf .xnu-src
            git clone --depth 1 --branch "$XNU_TAG" \
              https://github.com/apple-oss-distributions/xnu.git .xnu-src
          fi
          git -C .xnu-src log --oneline -1

      - name: Reset XNU source
        run: |
          # The source tree is cached between runs, so drop any patch or board
          # file left over from a previous build before applying this one.
          git -C .xnu-src checkout -- .
          git -C .xnu-src clean -fdq

      - name: Apply build patches
        run: tools/ci/apply-patches.sh .xnu-src

      - name: Copy board files
        run: tools/ci/apply-board.sh .xnu-src

      - name: Build kernel
        run: tools/ci/build-xnu.sh

      - name: Upload mach_kernel
        uses: actions/upload-artifact@v4
        with:
          name: mach_kernel-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE }}
          path: |
            build/mach_kernel
            build/obj/${{ env.KERNEL_CONFIG }}_ARM64_*/*.unstripped*
          if-no-files-found: error
          retention-days: 14
