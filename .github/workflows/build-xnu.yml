name: build-xnu

# XNU only builds on macOS, so the kernel is cross-compiled here and the
# resulting mach_kernel is downloaded, packaged with bootshim/patch_boot.py and
# flashed from a Windows/Linux workstation.

on:
  workflow_dispatch:
    inputs:
      machine:
        description: "XNU machine configuration"
        type: choice
        options: [bcm2837, dandelion]
        default: bcm2837
      kernel:
        description: "Kernel configuration"
        type: choice
        # KASAN is a kernel profile in this tree (makedefs/MakeInc.def:17), not a
        # config option, so hunting the 2026-10-31 memory corruption needs a build
        # with this input rather than an options line in MASTER.arm64.dandelion.
        options: [DEVELOPMENT, RELEASE, KASAN]
        default: DEVELOPMENT
      xcode:
        # KASAN on arm64 in this tree is the HWASAN variant and needs a clang that
        # accepts -fsanitize=kernel-hwaddress; the 16.4 toolchain rejects it, so the
        # sanitizer build has to pick a newer Xcode explicitly.
        description: "Xcode version to build with"
        type: choice
        options: ["16.4", "26.3", "26.2", "26.1", "26.0", newest]
        default: "16.4"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-xnu.yml"
      - "tools/ci/**"
      - "config/**"
      - "pexpert/**"
      - "iokit/**"
      - "patches/**"

concurrency:
  group: build-xnu-${{ github.ref }}-${{ inputs.machine || 'dandelion' }}-${{ inputs.kernel || 'DEVELOPMENT' }}
  cancel-in-progress: true

env:
  XNU_TAG: xnu-8796.141.3

jobs:
  build:
    # macos-14 is retired on 2026-11-02 and its brownout windows cancel queued jobs
    # ("This job failed because of a scheduled macOS 14 runner image brownout"), so
    # the build lives on macos-15 now.  That image has no Xcode 15 - only 16.x and
    # 26.x, i.e. clang 17+ - which rejected this 2023 tree in two ways; patches
    # zzz7 (uio_stackbuf_t array alignment) and zzz8 (DriverKit IORPC::kernelContent)
    # are what make it buildable there.  docs/CI-RUNNERS.md has the details.
    runs-on: macos-15
    timeout-minutes: 240

    env:
      MACHINE: ${{ inputs.machine || 'dandelion' }}
      KERNEL_CONFIG: ${{ inputs.kernel || 'DEVELOPMENT' }}
      XNU_SRC: ${{ github.workspace }}/.xnu-src
      BUILD_ROOT: ${{ github.workspace }}/build

    steps:
      - uses: actions/checkout@v4

      # Pick one Xcode explicitly instead of taking whatever the image defaults to,
      # so a toolchain change shows up as a one-line difference in this file rather
      # than as a mysterious compile error.  The default (16.4) is the version whose
      # clang 17 produced the two failures zzz7/zzz8 fix; the KASAN profile needs a
      # newer one because arm64 KASAN in this tree is HWASAN.  The list is printed
      # either way so a future image change is diagnosable from the log.
      - name: Select the Xcode this build asks for
        run: |
          ls -d /Applications/Xcode*.app || true
          want="${{ inputs.xcode || '16.4' }}"
          case "$want" in
            16.4) candidates="Xcode_16.4" ;;
            26.*) candidates="Xcode_$want" ;;
            newest) candidates="Xcode_26.3 Xcode_26.2 Xcode_26.1 Xcode_26.0" ;;
            *) candidates="Xcode_$want" ;;
          esac
          chosen=""
          for candidate in $candidates; do
            if [ -d "/Applications/$candidate.app" ]; then
              echo "selecting $candidate"
              sudo xcode-select -s "/Applications/$candidate.app"
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "requested Xcode ($want) not present; keeping the image default"
          fi
          xcode-select -p
          clang --version

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          clang --version
          echo "machine=$MACHINE kernel=$KERNEL_CONFIG"

      # A shallow clone of the release tag is ~200 MB and never changes, so it
      # is worth keeping between runs.
      - name: Cache XNU source
        uses: actions/cache@v4
        with:
          path: .xnu-src
          key: xnu-src-${{ env.XNU_TAG }}-v1

      - name: Fetch XNU ${{ env.XNU_TAG }}
        run: |
          if [ ! -f .xnu-src/Makefile ]; then
            rm -rf .xnu-src
            git clone --depth 1 --branch "$XNU_TAG" \
              https://github.com/apple-oss-distributions/xnu.git .xnu-src
          fi
          git -C .xnu-src log --oneline -1

      - name: Reset XNU source
        run: |
          # The source tree is cached between runs, so drop any patch or board
          # file left over from a previous build before applying this one.
          git -C .xnu-src checkout -- .
          git -C .xnu-src clean -fdq

      - name: Apply build patches
        run: tools/ci/apply-patches.sh .xnu-src

      - name: Copy board files
        run: tools/ci/apply-board.sh .xnu-src

      - name: Build kernel
        run: tools/ci/build-xnu.sh

      - name: Upload mach_kernel
        uses: actions/upload-artifact@v4
        with:
          name: mach_kernel-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE }}
          path: |
            build/mach_kernel
            build/obj/${{ env.KERNEL_CONFIG }}_ARM64_*/*.unstripped*
          if-no-files-found: error
          retention-days: 14
