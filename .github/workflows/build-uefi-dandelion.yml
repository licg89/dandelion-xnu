name: build-uefi-dandelion

# EDK2 firmware for the Redmi 9A (MT6762G).
#
# Two reasons this runs on a Linux runner rather than locally:
#   - building from the Windows mount inside WSL (/mnt/...) stalls in Mu's
#     "Init Self Describing Environment" step, which walks the whole tree and
#     9p is far too slow for that;
#   - the submodules must be a real git checkout, not an extracted zip, or
#     stuart cannot build its workspace (MdePkg.dec(33) "not found in
#     workspace").
#
# The EDK2 base is an external fork, so the job clones it with submodules and
# then overlays the packages that live in *this* repository.
on:
  push:
    paths:
      - 'Silicon/MediaTek/MT6765Pkg/**'
      - 'Platforms/Xiaomi/dandelionPkg/**'
      - 'Resources/**'
      - '.github/workflows/build-uefi-dandelion.yml'
  workflow_dispatch:

env:
  UEFI_REPO: https://github.com/mouseos/uefi-a04br3.git
  WORK: ${{ github.workspace }}/uefi

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout our packages
        uses: actions/checkout@v4
        with:
          path: dandelion-xnu

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv uuid-dev iasl \
            gcc-aarch64-linux-gnu build-essential git
          python3 -m pip install --upgrade pip

      - name: Clone the EDK2 base with submodules
        run: |
          git clone --recursive --depth 1 "$UEFI_REPO" "$WORK"
          ls "$WORK" | head -20
          test -f "$WORK/Mu_Basecore/MdePkg/MdePkg.dec" && echo "MdePkg present"

      - name: Install the Mu python requirements
        run: |
          cd "$WORK"
          python3 -m pip install -r pip-requirements.txt

      - name: Overlay our packages
        run: |
          set -e
          mkdir -p "$WORK/Silicon/MediaTek" "$WORK/Platforms/Xiaomi" "$WORK/Resources/Configs" "$WORK/Resources/DTBs"
          rm -rf "$WORK/Silicon/MediaTek/MT6765Pkg" "$WORK/Platforms/Xiaomi/dandelionPkg"
          cp -r dandelion-xnu/Silicon/MediaTek/MT6765Pkg "$WORK/Silicon/MediaTek/"
          cp -r dandelion-xnu/Platforms/Xiaomi/dandelionPkg "$WORK/Platforms/Xiaomi/"
          cp -f dandelion-xnu/Resources/Configs/dandelion.toml "$WORK/Resources/Configs/"
          cp -f dandelion-xnu/Resources/DTBs/dandelion.dtb "$WORK/Resources/DTBs/"
          echo "MT6765Pkg: $(find "$WORK/Silicon/MediaTek/MT6765Pkg" -type f | wc -l) files"
          echo "dandelionPkg: $(find "$WORK/Platforms/Xiaomi/dandelionPkg" -type f | wc -l) files"

      - name: Check that the three module lists agree
        # A module ships only when dandelion.dsc [Components] (compiled),
        # Include/DXE.inc (placed in the FV) and Include/APRIORI.inc (dispatch
        # order) agree.  Getting one wrong fails silently: the build succeeds and
        # the module is simply absent (CORRECTIONS C13).  Costs a second.
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE"/dandelion-xnu/tools/check_modules.py

      - name: Apply our patches to the EDK2 base
        # MediaTekPkg and friends live in the upstream fork, so the fixes we
        # need there are kept as patches in Resources/MuPatches and applied
        # here.  Without this the build stops at MsdcDxe.c with
        # -Werror,-Wunused-but-set-variable.
        run: |
          set -e
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/dandelion-xnu/Resources/MuPatches/*.patch; do
            echo "applying $(basename "$p")"
            # absolute path: git -C changes the working directory
            git -C "$WORK" apply -p1 --verbose "$p"
          done

      - name: SimpleFbDxe panel pitch for dandelion
        # Upstream sets PixelsPerScanLine = Width, i.e. it assumes the scanout
        # pitch equals the visible width.  dandelion scans out 736 pixels per
        # line (2944 bytes) with only 720 visible.
        #
        # This used to be a sed inline here, which meant CI built 736 while a
        # local build built 720 -- two different firmwares from one commit.
        # Both paths now call tools/prepare_uefi_tree.py so there is one copy
        # of the fix.
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE"/dandelion-xnu/tools/prepare_uefi_tree.py "$WORK"
          grep -rn "PixelsPerScanLine" "$WORK" --include=SimpleFb.c

      - name: Disable the x86 NASM external dependency
        # mu_nasm packages the x86 assembler; an aarch64-only build never runs
        # it, and the feed is not reachable from CI.
        run: |
          F="$WORK/Mu_Basecore/BaseTools/Bin/nasm_ext_dep.yaml"
          if [ -f "$F" ]; then
            sed -i 's/"scope": "edk2-build"/"scope": "edk2-build-disabled-dandelion"/' "$F"
            grep -n scope "$F"
          fi

      - name: Fetch external dependencies
        working-directory: ${{ env.WORK }}
        run: stuart_update -c Platforms/Xiaomi/dandelionPkg/DeviceBuild.py
        continue-on-error: true

      - name: Build
        working-directory: ${{ env.WORK }}
        run: python3 build_uefi.py -d dandelion -m 0 -r DEBUG -c

      - name: Collect firmware and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-fd
          path: |
            uefi/Build/**/FV/*.fd
            uefi/Build/BUILDLOG_*.txt
          if-no-files-found: warn
